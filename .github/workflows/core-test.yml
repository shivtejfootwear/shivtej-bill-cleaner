name: Core tests only

# Fast check of the bill reader (no APK, no emulator): push to the core-test branch.
on:
  push:
    branches: [core-test]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Core tests
        run: gradle --no-daemon --continue :core:test 2>&1 | tee build-log.txt || true
      - name: Publish
        if: always()
        run: |
          mkdir -p out
          cp core/build/test-results/test/*.xml out/ 2>/dev/null || true
          grep -E "FAILED|PASSED|BUILD|^e: " build-log.txt > out/summary.txt || true
          echo "sha=${{ github.sha }}" > out/run.txt
          cd out
          git init -q -b ci-core
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -qm "core ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-core
