name: OCR only

# Real phone OCR on chosen bill photos, without building a release. Push to the ocr-run branch.
on:
  push:
    branches: [ocr-run]

jobs:
  ocr-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Start an emulator and read the real bill photos
        timeout-minutes: 75
        run: |
          set +e
          mkdir -p ocr
          ls -la /dev/kvm > ocr/emulator-status.txt 2>&1
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin
          export ANDROID_AVD_HOME=$HOME/.android/avd; mkdir -p $ANDROID_AVD_HOME
          IMG="system-images;android-30;google_apis;x86_64"
          yes | $SDK/sdkmanager --licenses > /dev/null 2>&1
          $SDK/sdkmanager --install "$IMG" "emulator" "platform-tools" > ocr/sdk.txt 2>&1
          echo no | $SDK/avdmanager create avd -n t -k "$IMG" -d pixel --force > ocr/avd.txt 2>&1
          $SDK/avdmanager list avd >> ocr/avd.txt 2>&1; ls -la $ANDROID_AVD_HOME >> ocr/avd.txt
          echo "disk.dataPartition.size=3G" >> $ANDROID_AVD_HOME/t.avd/config.ini
          export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          nohup emulator -avd t -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 4096 -partition-size 3072 > ocr/emulator.txt 2>&1 &
          timeout 600 adb wait-for-device
          timeout 900 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          echo "boot exit=$?" >> ocr/emulator-status.txt
          adb shell settings put global window_animation_scale 0
          OCR_TEST="$(cat .github/ocr-test.txt 2>/dev/null)" bash .github/ocr-check.sh
          adb emu kill || true

      - name: Publish OCR results branch
        if: always()
        run: |
          mkdir -p ocr
          cd ocr
          echo "run=${{ github.run_number }} sha=${{ github.sha }}" > run.txt
          git init -q -b ci-ocr-only
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ocr run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-ocr-only
