name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK GitHub runner par pehle se hota hai (ANDROID_HOME)

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # GitHub Secrets (BILL_KEYSTORE_BASE64 ...) set hon to unhi se sign; warna repo ki fixed key
      - name: Signing key (agar secrets hain)
        env:
          KS_B64: ${{ secrets.BILL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.BILL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BILL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BILL_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK ka naam
        run: cp app/build/outputs/apk/release/app-release.apk Shivtej-Bill-Cleaner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shivtej-Bill-Cleaner-apk
          path: Shivtej-Bill-Cleaner.apk

      - name: Release par APK daalo (phone se download ke liye)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bill Cleaner 1.0.${{ github.run_number }}
          files: Shivtej-Bill-Cleaner.apk
