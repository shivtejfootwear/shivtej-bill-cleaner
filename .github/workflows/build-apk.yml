name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # If GitHub secrets (BILL_KEYSTORE_BASE64 ...) exist they sign the app; otherwise the key in the repo does.
      - name: Signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.BILL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Tests, screenshots and APK
        id: build
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.BILL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BILL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BILL_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --continue :core:test :app:recordRoborazziDebug :app:assembleRelease 2>&1 | tee build-log.txt

      - name: Collect results
        if: always()
        run: |
          mkdir -p results/screenshots results/tests
          cp app/build/screenshots/* results/screenshots/ 2>/dev/null || true
          cp core/build/test-results/test/*.xml results/tests/ 2>/dev/null || true
          find app/build/test-results -name "*.xml" -exec cp {} results/tests/ \; 2>/dev/null || true
          python3 .github/summarize.py results/tests > results/test-summary.txt || true
          grep -E "^e: |error:|FAILED|BUILD|What went wrong" -A3 build-log.txt | head -n 400 > results/build-errors.txt || true
          tail -n 200 build-log.txt > results/build-log-tail.txt || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} outcome=${{ steps.build.outcome }}" > results/run.txt
          cp app/build/outputs/apk/release/app-release.apk "results/Shivtej-Bill-Scanner-AI-2.0.${{ github.run_number }}.apk" 2>/dev/null || true

      - name: Check the APK (signature and package)
        if: always()
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          A=app/build/outputs/apk/release/app-release.apk
          { echo "build-tools: $BT"; $BT/apksigner verify --verbose --print-certs $A; echo "apksigner exit=$?"; $BT/aapt2 dump badging $A | head -20; $BT/zipalign -c -P 16 -v 4 $A | tail -3; echo "zipalign exit=$?"; } > results/apk-check.txt 2>&1 || true

      - name: Publish results branch
        if: always()
        run: |
          cd results
          git init -q -b ci-results
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "results run ${{ github.run_number }} (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results

      - name: Name the APK
        if: steps.build.outcome == 'success'
        run: cp app/build/outputs/apk/release/app-release.apk "Shivtej-Bill-Scanner-AI-2.0.${{ github.run_number }}.apk"

      - name: Release APK
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Shivtej Bill Scanner AI 2.0.${{ github.run_number }}
          files: Shivtej-Bill-Scanner-AI-2.0.${{ github.run_number }}.apk
          body: |
            फ़ोन में डाउनलोड करके खोलें। यह अलग ऐप है — पुराना Bill Cleaner वैसा ही रहेगा। अगली बार नया APK इसी Bill Scanner के ऊपर इंस्टॉल होगा (डेटा सुरक्षित)।
            Commit ${{ github.sha }}

  # Real on-device OCR on the real invoice photo, on an Android emulator. Only for checking accuracy.
  ocr-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Start an emulator and read the real bill photos
        timeout-minutes: 35
        run: |
          set +e
          mkdir -p ocr
          ls -la /dev/kvm > ocr/emulator-status.txt 2>&1
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin
          export ANDROID_AVD_HOME=$HOME/.android/avd; mkdir -p $ANDROID_AVD_HOME
          IMG="system-images;android-30;google_apis;x86_64"
          yes | $SDK/sdkmanager --licenses > /dev/null 2>&1
          $SDK/sdkmanager --install "$IMG" "emulator" "platform-tools" > ocr/sdk.txt 2>&1
          echo no | $SDK/avdmanager create avd -n t -k "$IMG" -d pixel --force > ocr/avd.txt 2>&1
          $SDK/avdmanager list avd >> ocr/avd.txt 2>&1; ls -la $ANDROID_AVD_HOME >> ocr/avd.txt
          export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          nohup emulator -avd t -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 4096 > ocr/emulator.txt 2>&1 &
          timeout 600 adb wait-for-device
          timeout 900 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          echo "boot exit=$?" >> ocr/emulator-status.txt
          adb shell settings put global window_animation_scale 0
          bash .github/ocr-check.sh
          adb emu kill || true

      - name: Publish OCR results branch
        if: always()
        run: |
          mkdir -p ocr
          cd ocr
          echo "run=${{ github.run_number }} sha=${{ github.sha }}" > run.txt
          git init -q -b ci-ocr
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ocr run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-ocr
